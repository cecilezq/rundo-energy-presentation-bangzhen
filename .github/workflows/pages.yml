name: Publish and expire presentation

on:
  push:
    branches: [main]
    paths:
      - presentation.html
      - scripts/build_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:
  schedule:
    - cron: '0 16 31 12 *'
    - cron: '17 16 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Decide whether a scheduled expiry deployment is due
        id: gate
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] && [[ "$(date -u +%s)" -lt "1798732800" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare active or expired site
        if: steps.gate.outputs.publish == 'true'
        run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        if: steps.gate.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
